# WPA Supplicant Configuration for TurboPi Home Wi-Fi Client
# This file is used to connect to a home Wi-Fi network while keeping the emergency AP active

# Control interface for wpa_cli
ctrl_interface=/var/run/wpa_supplicant
ctrl_interface_group=0
update_config=1

# Country code (adjust as needed, should match emergency AP setting)
country=US

# Home Wi-Fi Network Configuration
# NOTE: These values are placeholders and must be replaced during installation
# The installation script (install-home-wifi.sh) will update these values
# Do NOT commit actual Wi-Fi credentials to the repository
network={
    ssid="YOUR_HOME_SSID"
    psk="YOUR_HOME_PASSWORD"
    key_mgmt=WPA-PSK
    priority=10
}

# Optional: Add additional networks as needed
# network={
#     ssid="BACKUP_SSID"
#     psk="BACKUP_PASSWORD"
#     key_mgmt=WPA-PSK
#     priority=5
# }
