# Emergency Access Point Configuration for TurboPi
# This AP is always available for setup and recovery

# Interface configuration
interface=wlan0
driver=nl80211

# Network configuration
# SSID includes device-specific identifier to distinguish multiple robots
# NOTE: The installation script (install-emergency-ap.sh) automatically replaces
# <MAC> with the last 4 characters of your wlan0 MAC address during installation.
# If you're manually copying this file, replace <MAC> with your device's MAC suffix.
# Get MAC: ip link show wlan0 | grep 'link/ether'
# Example: If MAC is aa:bb:cc:dd:ee:ff, use ssid=TurboPi-Emergency-EEFF
ssid=TurboPi-Emergency-<MAC>

hw_mode=g

# Wi-Fi channel selection:
# Channel 6 is set by default as one of the three non-overlapping 2.4GHz channels (1, 6, 11).
# However, channel 6 is often congested in many environments.
# If you experience interference or connectivity issues, consider changing to channel 1 or 11,
# or scan for the least congested channel in your area.
# To scan for nearby Wi-Fi networks and their channels, you can use:
#   iw dev wlan0 scan | grep freq
# To change: set the value below to 1-11 as appropriate for your environment.
channel=6

ieee80211n=1
wmm_enabled=1

# Access Point settings
auth_algs=1
wpa=2
# WARNING: This is a default password
# CHANGE THIS before first connection or before deploying to production!
# Password must be 8-63 characters
# For maximum security, generate a unique password per device
wpa_passphrase=TurboPi-7f9d2b1c4e5a
wpa_key_mgmt=WPA-PSK
wpa_pairwise=CCMP
rsn_pairwise=CCMP

# Country code (adjust as needed)
country_code=US

# Logging
logger_syslog=-1
logger_syslog_level=2
