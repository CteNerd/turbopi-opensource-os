# Emergency Access Point Configuration for TurboPi
# This AP is always available for setup and recovery

# Interface configuration
interface=wlan0
driver=nl80211

# Network configuration
ssid=TurboPi-Emergency
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1

# Access Point settings
auth_algs=1
wpa=2
# WARNING: Default password - CHANGE THIS for production use
# Password must be 8-63 characters
wpa_passphrase=turbopi123
wpa_key_mgmt=WPA-PSK
wpa_pairwise=CCMP
rsn_pairwise=CCMP

# Country code (adjust as needed)
country_code=US

# Logging
logger_syslog=-1
logger_syslog_level=2
