# DHCP Configuration for TurboPi Emergency Access Point
# Separate subnet to avoid conflicts with home networks

# Interface to bind to
interface=wlan0
bind-interfaces

# DHCP range for emergency AP
# Using 192.168.50.x to avoid common home network ranges (192.168.0.x, 192.168.1.x)
dhcp-range=192.168.50.10,192.168.50.50,255.255.255.0,24h

# DNS settings
# Provide basic DNS resolution
server=8.8.8.8
server=8.8.4.4

# Static IP for the robot itself
# Robot will be at 192.168.50.1
address=/#/192.168.50.1

# Domain for the emergency network
domain=turbopi.local

# DHCP options
dhcp-option=option:router,192.168.50.1
dhcp-option=option:dns-server,192.168.50.1

# Logging
log-dhcp
log-queries
