name: Task
description: Specific unit of work
title: "TASK: "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        ## Task Issue Template
        Use this template for specific, actionable units of work.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done?
      placeholder: Describe the task in detail...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why is this task needed? What problem does it solve?
      placeholder: Provide background information...
    validations:
      required: false

  - type: input
    id: epic
    attributes:
      label: Related Epic
      description: Link to the parent epic (if any)
      placeholder: "#123"
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: How will we verify this task is complete?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true

  - type: textarea
    id: technical-notes
    attributes:
      label: Technical Notes
      description: Any technical considerations or implementation details
      placeholder: Implementation approach, files to modify, etc.
    validations:
      required: false
