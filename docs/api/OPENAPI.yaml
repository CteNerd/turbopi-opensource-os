openapi: 3.0.3
info:
  title: TurboPi OpenSource OS API
  version: 0.1.0
  description: >
    Backend API for TurboPi OpenSource OS.
    All hardware control and system actions must go through this API.
servers:
  - url: http://{robot_ip}:8080
paths:

  /health:
    get:
      summary: System health
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  uptime: { type: number }
                  cpu_temp: { type: number, nullable: true }
                  version: { type: string }
                  timestamp: { type: string, format: date-time }
                  memory:
                    type: object
                    properties:
                      total_mb: { type: number }
                      used_mb: { type: number }
                      available_mb: { type: number }
                  disk:
                    type: object
                    properties:
                      total_mb: { type: number }
                      used_mb: { type: number }
                      free_mb: { type: number }
                  services:
                    type: object
                    properties:
                      api: { type: string }
                      ui: { type: string }
                      updater: { type: string }
                      wake_word: { type: string }

  /diagnostics/bundle:
    get:
      summary: Download diagnostics bundle
      description: >
        Generates a downloadable diagnostics archive with redacted logs and
        configuration suitable for support without SSH access.
        Development prototype endpoint for trusted local-network use.
        This endpoint currently relies on same-host UI origin checks.
      responses:
        '200':
          description: gzipped tar diagnostics bundle
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        '403':
          description: Request origin is not allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: "forbidden" }
                  message: { type: string }
        '500':
          description: Failed to generate diagnostics bundle
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  message: { type: string }

  /system/version:
    get:
      summary: Get current software version
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  current: { type: string }
                  latest_stable: { type: string, nullable: true }

  /system/restart:
    post:
      summary: Restart TurboPi services
      description: >
        Development prototype endpoint for trusted local-network use.
        This endpoint currently relies on same-host UI origin checks and does
        not yet implement full authentication or authorization.
      responses:
        '202':
          description: Restart initiated
        '403':
          description: Request origin is not allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: "forbidden" }
                  message: { type: string }

  /system/reboot:
    post:
      summary: Reboot the robot
      description: >
        Development prototype endpoint for trusted local-network use.
        This endpoint currently relies on same-host UI origin checks and does
        not yet implement full authentication or authorization.
      responses:
        '202':
          description: Reboot initiated
        '403':
          description: Request origin is not allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: "forbidden" }
                  message: { type: string }

  /updates/check:
    get:
      summary: Check for available updates
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  update_available: { type: boolean }
                  latest_version: { type: string, nullable: true }

  /updates/apply:
    post:
      summary: Apply latest stable update
      description: >
        Development prototype endpoint for trusted local-network use.
        This endpoint currently relies on same-host UI origin checks and does
        not yet implement full authentication or authorization.
      responses:
        '200':
          description: No update needed (already on latest version)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "no_update_needed" }
                  message: { type: string, example: "Already running latest version 0.1.0" }
        '202':
          description: Update started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "update_started" }
                  message: { type: string, example: "Update to version 0.1.5 has been initiated" }
                  version: { type: string, example: "0.1.5" }
        '403':
          description: Request origin is not allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: "forbidden" }
                  message: { type: string }
        '500':
          description: Failed to fetch release information or verify integrity
          content:
            text/html:
              schema:
                type: string
                description: HTML error page

  /updates/config:
    get:
      summary: Get automatic update configuration
      responses:
        '200':
          description: Current automatic update settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  auto_update: { type: boolean, default: false }
                  channel:
                    type: string
                    enum: [stable]
                    default: stable
                  schedule_utc:
                    type: string
                    pattern: '^([01]\\d|2[0-3]):([0-5]\\d)$'
                    example: '03:00'
    post:
      summary: Update automatic update configuration
      description: >
        Development prototype endpoint for trusted local-network use.
        This endpoint currently relies on same-host UI origin checks and does
        not yet implement full authentication or authorization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                auto_update: { type: boolean }
                channel:
                  type: string
                  enum: [stable]
                schedule_utc:
                  type: string
                  pattern: '^([01]\\d|2[0-3]):([0-5]\\d)$'
      responses:
        '200':
          description: Update settings applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  auto_update: { type: boolean }
                  channel:
                    type: string
                    enum: [stable]
                  schedule_utc: { type: string }
                  persisted: { type: boolean }
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: bad_request }
                  message: { type: string }
        '403':
          description: Request origin is not allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: forbidden }
                  message: { type: string }
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: payload_too_large }
                  message: { type: string }
        '500':
          description: Settings applied at runtime but failed to persist, or unexpected server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: persistence_failed }
                  message: { type: string }
                  persisted: { type: boolean }

  /network/wifi/status:
    get:
      summary: Get Wi-Fi connection status
      description: Returns status of home Wi-Fi and emergency AP
      responses:
        '200':
          description: Current status of both network interfaces
          content:
            application/json:
              schema:
                type: object
                properties:
                  home_wifi:
                    type: object
                    description: Status of home Wi-Fi client connection
                    properties:
                      connected:
                        type: boolean
                        description: Whether the robot is connected to home Wi-Fi
                      ssid:
                        type: string
                        description: SSID of connected home network (empty if not connected)
                      ip_address:
                        type: string
                        description: IP address assigned by home DHCP server (empty if not connected)
                      interface:
                        type: string
                        description: Network interface used for home Wi-Fi (e.g., wlan1)
                  emergency_ap:
                    type: object
                    description: Status of emergency access point
                    properties:
                      active:
                        type: boolean
                        description: Whether the emergency AP is running
                      ssid:
                        type: string
                        description: SSID of emergency AP
                      ip_address:
                        type: string
                        description: Static IP of emergency AP (typically 192.168.50.1)
                      interface:
                        type: string
                        description: Network interface used for emergency AP (typically wlan0)

  /network/wifi/configure:
    post:
      summary: Configure home Wi-Fi connection
      description: >
        Configure the robot to connect to a home Wi-Fi network.
        Credentials are securely stored and persist across reboots.
        Emergency AP remains active if using a separate interface.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ssid
                - password
              properties:
                ssid:
                  type: string
                  description: Home Wi-Fi network SSID
                  minLength: 1
                  maxLength: 32
                password:
                  type: string
                  description: WPA2 password (8-63 characters)
                  minLength: 8
                  maxLength: 63
                  format: password
                interface:
                  type: string
                  description: Wi-Fi interface to use (default wlan1)
                  enum: [wlan0, wlan1]
                  default: wlan1
      responses:
        '200':
          description: Configuration saved, connecting
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  message: { type: string }
        '400':
          description: Invalid configuration (e.g., invalid SSID/password format)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  message: { type: string }
        '500':
          description: Configuration failed (e.g., service error, file write error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  message: { type: string }

  /network/wifi/disconnect:
    post:
      summary: Disconnect from home Wi-Fi
      description: Stops the home Wi-Fi client service. No parameters required.
      responses:
        '200':
          description: Disconnected successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Status of the operation (e.g., "disconnected")
                  message:
                    type: string
                    description: Human-readable message about the disconnection

  /control/arm:
    post:
      summary: Arm motors
      description: Arms manual control if E-Stop is not latched.
      responses:
        '200':
          description: Armed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "armed" }
        '409':
          description: Arm blocked (for example E-Stop latched)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "blocked" }
                  message: { type: string }
        '403':
          description: Request origin is not allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: "forbidden" }
                  message: { type: string }

  /control/disarm:
    post:
      summary: Disarm motors
      description: Disarms motors and forces zero output.
      responses:
        '200':
          description: Disarmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "disarmed" }
        '403':
          description: Request origin is not allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: "forbidden" }
                  message: { type: string }

  /control/estop:
    post:
      summary: Emergency stop
      description: Latches E-Stop and immediately disarms/stops motors.
      responses:
        '200':
          description: E-Stop engaged
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "estop_engaged" }
        '403':
          description: Request origin is not allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: "forbidden" }
                  message: { type: string }

  /control/estop/reset:
    post:
      summary: Reset latched E-Stop
      description: Clears E-Stop latch. Motors remain disarmed until explicitly armed.
      responses:
        '200':
          description: E-Stop reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "estop_cleared" }
        '403':
          description: Request origin is not allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: "forbidden" }
                  message: { type: string }

  /control/state:
    get:
      summary: Get current control safety state
      responses:
        '200':
          description: Current control and safety state
          content:
            application/json:
              schema:
                type: object
                properties:
                  armed: { type: boolean }
                  estop_latched: { type: boolean }
                  mode: { type: string }
                  deadman_triggered: { type: boolean }
                  linear_mps: { type: number }
                  angular_rps: { type: number }
                  max_linear_speed: { type: number }
                  max_angular_speed: { type: number }
                  active_behavior:
                    type: string
                    nullable: true
                  motor_backend:
                    type: string
                    enum: [sim, vendor]
                  motor_disabled_channels:
                    type: array
                    items:
                      type: integer
                      minimum: 1
                      maximum: 4
                  motor_degraded: { type: boolean }
                  motor_degraded_reason:
                    type: string
                    nullable: true
                  head_pan_deg: { type: number }
                  head_tilt_deg: { type: number }
                  head_pan_min_deg: { type: number }
                  head_pan_max_deg: { type: number }
                  head_tilt_min_deg: { type: number }
                  head_tilt_max_deg: { type: number }
                  head_backend:
                    type: string
                    enum: [sim]

  /control/head:
    post:
      summary: Move camera head pan/tilt
      description: >
        Applies clamped pan/tilt camera-head commands through the control safety layer.
        This endpoint currently relies on same-host UI origin checks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pan_deg:
                  type: number
                  description: Desired pan angle in degrees. Clamped to configured bounds.
                tilt_deg:
                  type: number
                  description: Desired tilt angle in degrees. Clamped to configured bounds.
                center:
                  type: boolean
                  description: If true, moves to configured center and ignores pan_deg/tilt_deg.
      responses:
        '200':
          description: Head command accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
                  pan_deg: { type: number }
                  tilt_deg: { type: number }
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: bad_request }
                  message: { type: string }
        '403':
          description: Request origin is not allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: forbidden }
                  message: { type: string }
        '409':
          description: Head command blocked by safety state (for example E-Stop latched)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: blocked }
                  message: { type: string }
        '500':
          description: Unexpected head-control backend error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: error }
                  message: { type: string }

  /control/follow/start:
    post:
      summary: Start follow behavior
      description: Enables autonomous follow behavior for an optional target id selected by UI.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                target_id:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Follow behavior started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "started" }
                  target_id:
                    type: integer
                    nullable: true
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: "bad_request" }
                  message: { type: string }
        '403':
          description: Request origin is not allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: "forbidden" }
                  message: { type: string }

  /control/follow/stop:
    post:
      summary: Stop follow behavior
      description: Disables follow behavior and forces zero motion output.
      responses:
        '200':
          description: Follow behavior stopped
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "stopped" }
        '403':
          description: Request origin is not allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: "forbidden" }
                  message: { type: string }

  /control/follow/state:
    get:
      summary: Get follow behavior state
      responses:
        '200':
          description: Current follow behavior state
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  target_id:
                    type: integer
                    nullable: true
                  lost_target: { type: boolean }
                  linear_mps: { type: number }
                  angular_rps: { type: number }

  /control/follow/observation:
    post:
      summary: Submit target observation for follow control
      description: Supplies latest selected-target observation from vision runtime/UI selection layer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_id, center_x, area]
              properties:
                target_id:
                  type: integer
                  minimum: 1
                center_x:
                  type: number
                  minimum: 0
                  maximum: 1
                area:
                  type: number
                  minimum: 0
                  maximum: 1
      responses:
        '200':
          description: Observation accepted or ignored (target mismatch)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [accepted, ignored] }
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: "bad_request" }
                  message: { type: string }
        '403':
          description: Request origin is not allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: "forbidden" }
                  message: { type: string }

  /video/stream:
    get:
      summary: MJPEG live camera stream
      description: >
        Provides a multipart MJPEG stream intended for teleoperation and
        debugging UI panels.
      parameters:
        - in: query
          name: frames
          schema:
            type: integer
            minimum: 1
          required: false
          description: Optional frame cap useful for tests and diagnostics.
        - in: query
          name: seconds
          schema:
            type: number
            minimum: 0.1
          required: false
          description: Optional max stream duration for this request.
      responses:
        '200':
          description: MJPEG stream
          content:
            multipart/x-mixed-replace:
              schema:
                type: string
                description: Multipart stream with image/jpeg frames
        '500':
          description: Stream initialization failure

  /video/stats:
    get:
      summary: Current video streaming stats
      responses:
        '200':
          description: Video stream FPS and activity status
          content:
            application/json:
              schema:
                type: object
                properties:
                  fps: { type: number }
                  frames_total: { type: integer }
                  active: { type: boolean }

  /voice/wake-word/status:
    get:
      summary: Get wake word detection status
      description: >
        Returns the current status of wake word detection including whether
        voice capture is armed and time remaining before timeout.
      responses:
        '200':
          description: Wake word status
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                    description: Whether wake word detection is enabled
                  wake_word:
                    type: string
                    description: Current wake word
                  armed:
                    type: boolean
                    description: Whether voice capture is currently armed (wake word detected recently)
                  timeout_seconds:
                    type: number
                    description: Timeout duration in seconds
                  time_remaining:
                    type: number
                    nullable: true
                    description: Seconds remaining before armed state times out (null if not armed)
        '503':
          description: Wake word engine not available

  /voice/wake-word/config:
    get:
      summary: Get wake word configuration
      description: Returns the current wake word configuration settings.
      responses:
        '200':
          description: Wake word configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  wake_word:
                    type: string
                    description: Current wake word
                  enabled:
                    type: boolean
                    description: Whether wake word detection is enabled
                  timeout_seconds:
                    type: number
                    description: Timeout duration in seconds
        '503':
          description: Wake word engine not available
    post:
      summary: Update wake word configuration
      description: >
        Update wake word settings. At least one parameter must be provided.
        Wake word must be ASCII-only and not empty.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                wake_word:
                  type: string
                  description: New wake word (ASCII only)
                  minLength: 1
                  maxLength: 50
                enabled:
                  type: boolean
                  description: Enable/disable wake word detection
      responses:
        '200':
          description: Configuration updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "updated"
                  wake_word:
                    type: string
                    description: Current wake word after update
                  enabled:
                    type: boolean
                    description: Current enabled state after update
                  timeout_seconds:
                    type: number
                    description: Timeout duration in seconds
        '400':
          description: Invalid configuration (e.g., non-ASCII wake word, empty string)
        '503':
          description: Wake word engine not available

  /voice/stt:
    post:
      summary: Speech to text
      requestBody:
        required: true
        content:
          audio/wav: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  transcript: { type: string }

  /voice/command:
    post:
      summary: Parse voice command from transcript
      description: >
        Parses a voice transcript into a command intent that will be routed
        through the safety arbiter. This endpoint does NOT execute commands
        directly - it only parses and validates the intent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - transcript
              properties:
                transcript:
                  type: string
                  description: Voice transcript from STT
      responses:
        '200':
          description: Command parsed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  command:
                    type: string
                    enum: [STOP, FOLLOW, UNKNOWN]
                    description: Command type
                  target:
                    type: string
                    nullable: true
                    description: Command target (for FOLLOW commands)
                  confidence:
                    type: number
                    description: Confidence score (0.0 to 1.0)
                  is_valid:
                    type: boolean
                    description: Whether command is valid and actionable
                  raw_transcript:
                    type: string
                    description: Original transcript for audit trail
        '400':
          description: Invalid request (e.g., missing transcript)

  /voice/tts:
    post:
      summary: Text to speech
      description: Server-side OpenAI TTS synthesis for UI audible feedback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  maxLength: 1000
                  description: Text to synthesize (max 1000 chars)
                voice:
                  type: string
                  description: Optional OpenAI voice name
      responses:
        '200':
          description: Audio stream returned
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid request (for example missing text)
        '403':
          description: Request origin is not allowed
        '413':
          description: Request payload too large
        '503':
          description: TTS provider unavailable or not configured

  /voice/conversation:
    post:
      summary: Conversational response
      description: Conversational pipeline endpoint isolated from control execution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Conversational reply
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    type: string
                  guardrail_triggered:
                    type: boolean
        '400':
          description: Invalid request
        '403':
          description: Request origin is not allowed
        '413':
          description: Request payload too large
